lor:var(--accent);background:rgba(45,212,191,.05)}.upload-icon{width:74px;height:74px;margin:0 auto 16px;display:grid;place-items:center;border-radius:24px;background:rgba(56,189,248,.12);font-size:34px}.upload-title{font-size:20px;font-weight:800}.upload-hint{color:var(--muted);margin-top:8px}#viewer{display:none;padding:12px}#canvasWrap{min-height:560px;display:grid;place-items:center;overflow:auto;border-radius:12px;background:#050b14}#canvas{display:block;max-width:100%;max-height:72vh;object-fit:contain;cursor:crosshair;touch-action:none}.correction-bar{display:none;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:12px;background:rgba(7,17,31,.72)}.correction-label{font-weight:800}.correction-hint{color:var(--muted);font-size:12px}.statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;color:var(--muted)}.status{display:flex;align-items:center;gap:8px}.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 4px rgba(145,160,183,.1)}.dot.good{background:var(--good);box-shadow:0 0 0 4px rgba(52,211,153,.12)}.dot.warn{background:var(--warn);box-shadow:0 0 0 4px rgba(251,191,36,.12)}.busy{animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.35}}#results{min-height:700px}#empty{min-height:700px;display:grid;place-items:center;color:var(--muted);text-align:center;padding:28px}#resultBody{display:none}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:14px}.metric{padding:14px 12px;border:1px solid var(--line);border-radius:13px;background:rgba(7,17,31,.5)}.metric-label{color:var(--muted);font-size:12px}.metric-value{margin-top:3px;font-size:26px;line-height:1.2;font-weight:850;font-variant-numeric:tabular-nums}.notice{margin:0 14px 12px;padding:10px 12px;border-radius:10px;color:#bbf7d0;background:rgba(52,211,153,.09);border:1px solid rgba(52,211,153,.22);font-size:12px}.notice.warn{color:#fde68a;background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.22)}.settings{display:flex;align-items:center;gap:8px;padding:0 14px 12px;color:var(--muted);font-size:12px}.settings input{width:64px;color:var(--text);background:#0b1626;border:1px solid var(--line);border-radius:8px;padding:6px 8px}.table-wrap{max-height:495px;overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}table{width:100%;border-collapse:collapse;font-size:12px}th{position:sticky;top:0;z-index:1;color:var(--muted);background:#132137;font-weight:650;text-align:right;padding:9px 8px}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}td{padding:7px 8px;text-align:right;border-top:1px solid rgba(42,59,85,.7);font-variant-numeric:tabular-nums}tr:hover td{background:rgba(56,189,248,.035)}.course-name,.number-input{color:var(--text);background:#0b1626;border:1px solid transparent;border-radius:7px;padding:5px 6px}.course-name{width:112px}.number-input{width:58px;text-align:right}.course-name:focus,.number-input:focus{outline:none;border-color:var(--accent2)}.confidence{color:var(--muted);font-size:11px}.result-actions{display:flex;flex-wrap:wrap;gap:8px;padding:13px 14px}.footnote{padding:0 14px 15px;color:var(--muted);font-size:11px}@media(max-width:980px){.shell{padding:16px}header{align-items:flex-start;flex-direction:column}.layout{grid-template-columns:1fr}#dropZone{min-height:390px}#empty,#results{min-height:330px}}@media(max-width:520px){.shell{padding:10px}.summary{grid-template-columns:1fr}.course-name{width:88px}.privacy{white-space:normal}.correction-hint{flex-basis:100%}}

<body>
<div class="shell">
  <header><div><h1>雷达图 GPA 自动识别</h1><p class="lead">拖入微北洋 GPA 截图，自动还原每科成绩、学分、加权与 GPA。</p></div><div class="privacy">🔒 图片只在本机处理，不会上传</div></header>
  <main class="layout">
    <section class="panel">
      <div class="panel-head"><div class="panel-title">截图与识别标记</div><div class="toolbar"><button class="btn" id="overlayBtn" disabled>隐藏标记</button><button class="btn" id="rerunBtn" disabled>重新识别</button><button class="btn primary" id="chooseBtn">选择图片</button></div></div>
      <input id="fileInput" type="file" accept="image/*">
      <div id="dropZone" role="button" tabindex="0"><div><div class="upload-icon">⌁</div><div class="upload-title">把截图拖到这里</div><div class="upload-hint">也可点击选择，或直接按 Ctrl + V 粘贴截图</div></div></div>
      <div id="viewer"><div id="canvasWrap"><canvas id="canvas"></canvas></div><div class="correction-bar" id="correctionBar"><span class="correction-label">手动校正</span><button class="btn score-mode active" id="scoreModeBtn" type="button">调整成绩点</button><button class="btn credit-mode" id="creditModeBtn" type="button">调整学分点</button><button class="btn circle-mode" id="circleModeBtn" type="button">调整外圆/圆心</button><span class="correction-hint" id="correctionHint">在任意射线上点击或拖动，红点会自动吸附到最近的课程轴</span></div><div class="statusbar"><div class="status"><span class="dot" id="statusDot"></span><span id="statusText">等待图片</span></div><span id="imageInfo"></span></div></div>
    </section>
    <section class="panel" id="results" data-ready="false">
      <div class="panel-head"><div class="panel-title">识别结果</div><div class="confidence" id="confidence"></div></div>
      <div id="empty">上传后会自动计算；通常不需要再点圆心或逐个标顶点。</div>
      <div id="resultBody">
        <div class="summary"><div class="metric"><div class="metric-label">加权成绩</div><div class="metric-value" id="weighted">—</div></div><div class="metric"><div class="metric-label">平均 GPA</div><div class="metric-value" id="gpa">—</div></div><div class="metric"><div class="metric-label">总学分</div><div class="metric-value" id="credits">—</div></div></div>
        <div class="notice" id="notice"></div>
        <div class="settings"><label for="courseCount">课程数</label><input id="courseCount" type="number" min="3" max="24"><button class="btn" id="applyCountBtn">按此数量重识别</button><span>顺序：正右方开始，顺时针</span></div>
        <div class="table-wrap"><table><thead><tr><th>#</th><th>课程（可改）</th><th>成绩</th><th>学分</th><th>GPA</th></tr></thead><tbody id="courseRows"></tbody></table></div>
        <div class="result-actions"><button class="btn primary" id="copyBtn">复制汇总</button><button class="btn" id="csvBtn">导出 CSV</button></div>
        <div class="footnote">识别值会自动取整到课程成绩与 0.5 学分；少见主题、裁剪或涂鸦截图请核对表格，可直接修改后重新计算。</div>
      </div>
    </section>
  </main>
</div>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id);
const els={input:$('fileInput'),drop:$('dropZone'),viewer:$('viewer'),canvas:$('canvas'),choose:$('chooseBtn'),rerun:$('rerunBtn'),overlay:$('overlayBtn'),correction:$('correctionBar'),scoreMode:$('scoreModeBtn'),creditMode:$('creditModeBtn'),circleMode:$('circleModeBtn'),correctionHint:$('correctionHint'),dot:$('statusDot'),status:$('statusText'),info:$('imageInfo'),results:$('results'),empty:$('empty'),body:$('resultBody'),confidence:$('confidence'),notice:$('notice'),weighted:$('weighted'),gpa:$('gpa'),credits:$('credits'),rows:$('courseRows'),count:$('courseCount'),applyCount:$('applyCountBtn'),copy:$('copyBtn'),csv:$('csvBtn')};
const ctx=els.canvas.getContext('2d',{willReadFrequently:true}),source=document.createElement('canvas'),sourceCtx=source.getContext('2d',{willReadFrequently:true});
const state={fileName:'',image:null,imageData:null,result:null,overlay:true,busy:false,editing:null,editMode:'score',selectedIndex:null,loadId:0,analysisId:0};
const MAX_IMAGE_DIMENSION=3200,MAX_IMAGE_PIXELS=8_000_000;
/* radar-gpa-core:start */
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v)),average=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0;
const median=a=>{if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length&1?b[m]:(b[m-1]+b[m])/2};
const roundHalf=v=>Math.round(v*2)/2,fmt=(v,n=2)=>Number.isFinite(v)?v.toFixed(n):'—';
const scoreToGpa=score=>score>=90?4:score>=85?3.7:score>=82?3.3:score>=78?3:score>=75?2.7:score>=72?2.3:score>=68?2:score>=64?1.5:score>=60?1:0;
function fitImageSize(width,height){const scale=Math.min(1,MAX_IMAGE_DIMENSION/Math.max(width,height),Math.sqrt(MAX_IMAGE_PIXELS/(width*height)));return{width:Math.max(1,Math.round(width*scale)),height:Math.max(1,Math.round(height*scale)),scale}}
function setStatus(text,kind='',busy=false){els.status.textContent=text;els.dot.className=`dot ${kind} ${busy?'busy':''}`.trim()}
function pixel(data,w,h,x,y){x=Math.round(x);y=Math.round(y);if(x<0||x>=w||y<0||y>=h)return null;const p=(y*w+x)*4;return[data[p],data[p+1],data[p+2]]}
function colorDifference(a,b){return!a||!b?0:(Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]))/3}

function largestWhiteComponent(imageData,w,h){
  const src=imageData.data,total=w*h,topLimit=Math.floor(h*.76),mask=new Uint8Array(total),seen=new Uint8Array(total),queue=new Int32Array(total);

  let best=null;
  for(let start=0;start<topLimit*w;start++){
    if(!mask[start]||seen[start])continue;let head=0,tail=0,minX=w,minY=h,maxX=0,maxY=0;const members=[];queue[tail++]=start;seen[start]=1;
    while(head<tail){const p=queue[head++],y=Math.floor(p/w),x=p-y*w;members.push(p);if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;const y0=Math.max(0,y-1),y1=Math.min(topLimit-1,y+1),x0=Math.max(0,x-1),x1=Math.min(w-1,x+1);for(let ny=y0;ny<=y1;ny++)for(let nx=x0;nx<=x1;nx++){const np=ny*w+nx;if(mask[np]&&!seen[np]){seen[np]=1;queue[tail++]=np}}}
    const bw=maxX-minX+1,bh=maxY-minY+1;if(bw>w*.12&&bh>h*.12&&(!best||members.length>best.members.length))best={members,minX,minY,maxX,maxY,width:bw,height:bh};
  }
  if(!best||best.members.length<500)throw new Error('没有找到完整的白色成绩折线');return best;
}
function quantile(values,q){if(!values.length)return 0;const a=[...values].sort((x,y)=>x-y),p=(a.length-1)*q,i=Math.floor(p),f=p-i;return a[i]+(a[Math.min(i+1,a.length-1)]-a[i])*f}
function pointContrast(data,w,h,cx,cy,r,angle,offset=4){const ca=Math.cos(angle),sa=Math.sin(angle),x=cx+r*ca,y=cy+r*sa,p=pixel(data,w,h,x,y),p1=pixel(data,w,h,x-offset*sa,y+offset*ca),p2=pixel(data,w,h,x+offset*sa,y-offset*ca);return(colorDifference(p,p1)+colorDifference(p,p2))/2}

// A pasted/collaged screenshot can move the radar far away from the image centre.
// Locate a large, isolated, saturated region first; full-screen themes touch the
// image border and deliberately fall back to w/2.
function detectRadarRegion(data,w,h){
  const step=Math.max(2,Math.round(Math.min(w,h)/430)),gw=Math.ceil(w/step),scanH=Math.floor(h*.76),gh=Math.ceil(scanH/step),mask=new Uint8Array(gw*gh),seen=new Uint8Array(gw*gh),queue=new Int32Array(gw*gh);
  for(let gy=0;gy<gh;gy++)for(let gx=0;gx<gw;gx++){const p=pixel(data,w,h,Math.min(w-1,gx*step),Math.min(h-1,gy*step)),mx=Math.max(...p),mn=Math.min(...p),chroma=mx-mn;if(chroma>45&&chroma/Math.max(80,mx)>.23)mask[gy*gw+gx]=1}
  let edgeHits=0,edgeTotal=gw+2*gh;for(let x=0;x<gw;x++)edgeHits+=mask[x];for(let y=0;y<gh;y++){edgeHits+=mask[y*gw]+mask[y*gw+gw-1]}if(edgeHits/edgeTotal>.28)return null;
  let best=null;
  for(let start=0;start<mask.length;start++){
    if(!mask[start]||seen[start])continue;let head=0,tail=0,minX=gw,minY=gh,maxX=0,maxY=0;queue[tail++]=start;seen[start]=1;
    while(head<tail){const p=queue[head++],y=Math.floor(p/gw),x=p-y*gw;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);for(let yy=Math.max(0,y-1);yy<=Math.min(gh-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(gw-1,x+1);xx++){const np=yy*gw+xx;if(mask[np]&&!seen[np]){seen[np]=1;queue[tail++]=np}}}
    const bw=(maxX-minX+1)*step,bh=(maxY-minY+1)*step,touches=minX<=1||minY<=1||maxX>=gw-2||maxY>=gh-2,square=Math.min(bw,bh)/Math.max(bw,bh),area=tail*step*step;
    if(!touches&&square>.86&&bw>Math.min(w,h)*.28&&bh>Math.min(w,h)*.28&&area>Math.min(w,h)**2*.055){const score=area*square;if(!best||score>best.score)best={score,cx:(minX+maxX+1)*step/2,cy:(minY+maxY+1)*step/2,radius:(bw+bh)/4,bbox:{x:minX*step,y:minY*step,width:bw,height:bh}}}
  }
  return best;
}

function horizontalAxisScore(data,w,h,cx,y,radius){
  const values=[],step=Math.max(1,radius/130),offsets=[Math.max(2,radius*.008),Math.max(3,radius*.014)];
  for(const dir of[-1,1])for(let r=radius*.12;r<radius*.92;r+=step){const p=pixel(data,w,h,cx+dir*r,y);if(!p)continue;const ds=[];for(const o of offsets){const a=pixel(data,w,h,cx+dir*r,y-o),b=pixel(data,w,h,cx+dir*r,y+o);if(!a||!b)continue;ds.push((Math.abs(2*p[0]-a[0]-b[0])+Math.abs(2*p[1]-a[1]-b[1])+Math.abs(2*p[2]-a[2]-b[2]))/6)}values.push(median(ds))}
  if(values.length<20)return-Infinity;return median(values)*.62+quantile(values,.75)*.28+quantile(values,.9)*.10;
}
function detectCenterY(data,w,h,cx,initialY,radius,span){
  let bestY=initialY,bestScore=-Infinity;const coarseStep=Math.max(1,radius*.006),candidates=[];
  for(let y=initialY-span;y<=initialY+span;y+=coarseStep){const s=horizontalAxisScore(data,w,h,cx,y,radius);candidates.push({y,score:s});if(s>bestScore){bestScore=s;bestY=y}}
  const coarse=bestY;for(let y=coarse-coarseStep;y<=coarse+coarseStep;y+=.5){const s=horizontalAxisScore(data,w,h,cx,y,radius);if(s>bestScore){bestScore=s;bestY=y}}
  candidates.sort((a,b)=>b.score-a.score);return{y:bestY,score:bestScore,candidates:candidates.slice(0,8)};
}
function rightmostVertexY(component,w,cx,initialY,radius){
  let maxX=-Infinity;const points=[];for(const p of component.members){const y=Math.floor(p/w),x=p-y*w;if(x<cx+radius*.25||x>cx+radius*1.12||Math.abs(y-initialY)>radius*.65)continue;points.push({x,y});if(x>maxX)maxX=x}if(!points.length)return null;const band=Math.max(3,radius*.014),ys=points.filter(p=>p.x>=maxX-band).map(p=>p.y);if(ys.length<4)return null;const y=median(ys),spread=quantile(ys,.8)-quantile(ys,.2);return{y,spread,maxX,reliable:spread<radius*.09};
}

function polarWhiteProfile(component,w,cx,cy,maxRadius,bins=1440){
  const radial=new Float64Array(bins),twoPi=Math.PI*2;
  for(const p of component.members){const y=Math.floor(p/w),x=p-y*w,dx=x-cx,dy=y-cy,r=Math.hypot(dx,dy);if(r<maxRadius*.14||r>maxRadius*1.12)continue;let a=Math.atan2(dy,dx);if(a<0)a+=twoPi;const i=Math.round(a/twoPi*bins)%bins;if(r>radial[i])radial[i]=r}
  const valid=[];for(let i=0;i<bins;i++)if(radial[i]>0)valid.push(i);if(valid.length<bins*.2)return{profile:[...radial],coverage:valid.length/bins,shapeRadius:quantile([...radial].filter(Boolean),.96)};
  for(let i=0;i<bins;i++)if(!radial[i]){let l=1,r=1;while(l<bins&&!radial[(i-l+bins)%bins])l++;while(r<bins&&!radial[(i+r)%bins])r++;const lv=radial[(i-l+bins)%bins],rv=radial[(i+r)%bins];radial[i]=(lv*r+rv*l)/(l+r)}
  const smooth=new Array(bins),half=Math.max(1,Math.round(bins/720));for(let i=0;i<bins;i++){const v=[];for(let k=-half;k<=half;k++)v.push(radial[(i+k+bins)%bins]);smooth[i]=median(v)}
  return{profile:smooth,coverage:valid.length/bins,shapeRadius:quantile(smooth,.985)};
}
function detectCourseCountFromProfile(polar){
  const profile=polar.profile,bins=profile.length,gap=Math.max(2,Math.round(bins/360)),curve=new Array(bins);for(let i=0;i<bins;i++)curve[i]=Math.abs(2*profile[i]-profile[(i-gap+bins)%bins]-profile[(i+gap)%bins]);
  const local=(index)=>{let v=0;for(let k=-2;k<=2;k++)v=Math.max(v,curve[(index+k+bins)%bins]);return v},ranked=[];
  for(let n=3;n<=24;n++){const axes=[],gaps=[];for(let i=0;i<n;i++){axes.push(local(Math.round(i*bins/n)%bins));gaps.push(local(Math.round((i+.5)*bins/n)%bins))}const amplitude=median(axes)*.45+average(axes)*.55-(median(gaps)*.35+average(gaps)*.35);ranked.push({n,amplitude,axes:average(axes),gaps:average(gaps)})}
  ranked.sort((a,b)=>b.amplitude-a.amplitude);let selected=ranked[0];for(;;){const doubled=ranked.find(v=>v.n===selected.n*2);if(!doubled||doubled.amplitude<=selected.amplitude*.62)break;selected=doubled}const competitor=ranked.find(v=>v.n!==selected.n)||ranked[0],spread=Math.max(1,quantile(curve,.9));return{count:selected.n,ratio:Math.abs(selected.amplitude-competitor.amplitude)/spread,ranked};
}
function refineCenterWithPolygon(component,w,cx,baseY,radius,overrideCount=null){
  const step=Math.max(1,radius*.006),span=radius*.075;let best=null;
  for(let y=baseY-span;y<=baseY+span;y+=step){const polar=polarWhiteProfile(component,w,cx,y,radius),detection=detectCourseCountFromProfile(polar);if(!overrideCount&&detection.count<6)continue;const candidate=overrideCount?detection.ranked.find(v=>v.n===overrideCount):detection.ranked.find(v=>v.n===detection.count),quality=(candidate?.amplitude||-Infinity)*(1+Math.min(18,candidate?.n||0)*.006);if(!best||quality>best.quality)best={y,polar,detection,quality}}
  return best;
